<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title>
        Verify Email | Personal Digital Vault
    </title>

    <link rel="stylesheet"
          href="/css/main.css">

    <link rel="stylesheet"
          href="/css/layout.css">

    <link rel="stylesheet"
          href="/css/auth.css">

    <link rel="stylesheet"
          href="/css/responsive.css">

</head>


<body>

    <main class="auth-wrap">


        <!-- ===============================================
             LEFT SIDE
             =============================================== -->

        <section class="auth-visual">

            <div class="auth-brand">

                <span class="brand-mark">
                    🔐
                </span>

                Personal Digital Vault

            </div>


            <div class="auth-hero">

                <span class="eyebrow">
                    Email Security
                </span>

                <h1>
                    Verify your email.
                </h1>

                <p>
                    We sent a six-digit verification
                    code to your registered email address.
                </p>


                <div class="security-pills">

                    <span class="security-pill">
                        6-digit OTP
                    </span>

                    <span class="security-pill">
                        5 minute expiry
                    </span>

                    <span class="security-pill">
                        Secure verification
                    </span>

                </div>

            </div>


            <div class="auth-foot">
                Personal Digital Vault
            </div>

        </section>



        <!-- ===============================================
             RIGHT SIDE
             =============================================== -->

        <section class="auth-panel">

            <div class="auth-card">

                <span class="eyebrow">
                    Step 1 of 2
                </span>


                <h2>
                    Verify email
                </h2>


                <p class="auth-card__intro">

                    Verification code sent to

                    <strong id="emailDisplay">
                        your email
                    </strong>

                </p>


                <form id="verifyEmailForm">

                    <div class="field">

                        <label for="otp">
                            Verification code
                        </label>


                        <input id="otp"
                               name="otp"
                               class="otp-input"
                               type="text"
                               inputmode="numeric"
                               maxlength="6"
                               pattern="[0-9]{6}"
                               placeholder="000000"
                               autocomplete="one-time-code"
                               required>

                    </div>


                    <button type="submit">
                        Verify email
                    </button>

                </form>


                <p id="message"
                   class="error">
                </p>


                <div class="auth-actions">

                    <button id="resendButton"
                            class="btn--secondary"
                            type="button">

                        Resend code

                    </button>

                </div>


                <div class="auth-card__footer">

                    Wrong email?

                    <a href="/html/register.html">
                        Register again
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script type="module"
            src="/js/pages/verify-email.js">
    </script>

</body>

</html>
