<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Search Vault
    </title>


    <link rel="stylesheet"
          href="/css/main.css">

    <link rel="stylesheet"
          href="/css/layout.css">

    <link rel="stylesheet"
          href="/css/components.css">

    <link rel="stylesheet"
          href="/css/vault.css">

    <link rel="stylesheet"
          href="/css/responsive.css">

</head>


<body>


    <!-- ================================================= -->
    <!-- USER NAVIGATION -->
    <!-- ================================================= -->

    <header class="topbar">

        <strong>
            Personal Digital Vault
        </strong>


        <nav>

            <a href="/html/dashboard.html">
                Dashboard
            </a>

            <a href="/html/folders.html">
                Folders
            </a>

            <a href="/html/documents.html">
                Documents
            </a>

            <a href="/html/credentials.html">
                Credentials
            </a>

            <a href="/html/search.html">
                Search
            </a>

            <a href="/html/profile.html">
                Profile
            </a>


            <button type="button"
                    data-logout>

                Logout

            </button>

        </nav>

    </header>


    <!-- ================================================= -->
    <!-- MAIN -->
    <!-- ================================================= -->

    <main class="container">


        <h1>
            Search Your Vault
        </h1>


        <!-- ================================================= -->
        <!-- SEARCH FORM -->
        <!-- ================================================= -->

        <form id="searchForm"
              class="card">


            <label for="keyword">
                Search
            </label>


            <input id="keyword"
                   name="keyword"
                   type="search"
                   placeholder="Folder, document or credential title"
                   autocomplete="off"
                   required>


            <!-- ============================================= -->
            <!-- CLIENT-SIDE RESULT TYPE FILTER -->
            <!-- ============================================= -->
            <!--
                Backend API route change panna maatom.

                Search result vandha piragu
                frontend-la type filter pannuvom.
            -->

            <label for="typeFilter">
                Result Type
            </label>


            <select id="typeFilter">

                <option value="all">
                    All
                </option>

                <option value="folder">
                    Folders
                </option>

                <option value="document">
                    Documents
                </option>

                <option value="credential">
                    Credentials
                </option>

            </select>


            <button id="searchButton"
                    type="submit">

                Search

            </button>

        </form>


        <!-- ================================================= -->
        <!-- STATUS -->
        <!-- ================================================= -->

        <p id="message"
           aria-live="polite">
        </p>


        <!-- ================================================= -->
        <!-- RESULT COUNT -->
        <!-- ================================================= -->

        <p id="resultCount">
        </p>


        <!-- ================================================= -->
        <!-- RESULTS -->
        <!-- ================================================= -->

        <section id="list"
                 class="vault-list"
                 aria-live="polite">
        </section>


    </main>


    <!-- ================================================= -->
    <!-- PAGE JS -->
    <!-- ================================================= -->

    <script type="module"
            src="/js/pages/search.js">
    </script>


    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    <script type="module">

        import {
            initNavbar
        } from '/js/components/navbar.js';


        initNavbar();

    </script>


</body>

</html>
