<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Credentials
    </title>


    <link rel="stylesheet"
          href="/css/main.css">

    <link rel="stylesheet"
          href="/css/layout.css">

    <link rel="stylesheet"
          href="/css/components.css">

    <link rel="stylesheet"
          href="/css/vault.css">

    <link rel="stylesheet"
          href="/css/responsive.css">

</head>


<body>


    <!-- ================================================= -->
    <!-- NAVBAR -->
    <!-- ================================================= -->

    <header class="topbar">

        <strong>
            Personal Digital Vault
        </strong>


        <nav>

            <a href="/html/dashboard.html">
                Dashboard
            </a>

            <a href="/html/folders.html">
                Folders
            </a>

            <a href="/html/documents.html">
                Documents
            </a>

            <a href="/html/credentials.html">
                Credentials
            </a>

            <a href="/html/search.html">
                Search
            </a>

            <a href="/html/profile.html">
                Profile
            </a>


            <button type="button"
                    data-logout>

                Logout

            </button>

        </nav>

    </header>


    <!-- ================================================= -->
    <!-- MAIN -->
    <!-- ================================================= -->

    <main class="container">


        <h1>
            Credentials
        </h1>


        <!-- ================================================= -->
        <!-- CREATE / EDIT FORM -->
        <!-- ================================================= -->

        <form id="credentialForm"
              class="card">


            <h2 id="formTitle">
                Add Credential
            </h2>


            <!-- TITLE -->

            <label for="title">
                Title
            </label>

            <input id="title"
                   name="title"
                   type="text"
                   placeholder="Example: Personal Gmail"
                   autocomplete="off"
                   required>


            <!-- USERNAME -->

            <label for="username">
                Username / Email
            </label>

            <input id="username"
                   name="username"
                   type="text"
                   placeholder="Username or email"
                   autocomplete="off"
                   required>


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input id="password"
                   name="password"
                   type="password"
                   placeholder="Password"
                   autocomplete="new-password"
                   required>


            <!-- WEBSITE -->

            <label for="website">
                Website
            </label>

            <input id="website"
                   name="website"
                   type="url"
                   placeholder="https://example.com"
                   autocomplete="off">


            <!-- NOTES -->

            <label for="notes">
                Secure Notes
            </label>

            <textarea id="notes"
                      name="notes"
                      placeholder="Optional private notes">
            </textarea>


            <!-- ACTIONS -->

            <div class="vault-actions">

                <button id="saveButton"
                        type="submit">

                    Save Credential

                </button>


                <button id="cancelEditButton"
                        type="button"
                        hidden>

                    Cancel Edit

                </button>

            </div>


        </form>


        <!-- ================================================= -->
        <!-- MESSAGE -->
        <!-- ================================================= -->

        <p id="message"
           aria-live="polite">
        </p>


        <!-- ================================================= -->
        <!-- REVEALED CREDENTIAL -->
        <!-- ================================================= -->

        <section id="credentialDetails"
                 class="card"
                 hidden>


            <h2>
                Credential Details
            </h2>


            <div id="credentialDetailsContent">
            </div>


            <button id="hideCredentialButton"
                    type="button">

                Hide Details

            </button>


        </section>


        <!-- ================================================= -->
        <!-- LIST -->
        <!-- ================================================= -->

        <section>

            <h2>
                My Credentials
            </h2>


            <div id="list"
                 class="vault-list"
                 aria-live="polite">
            </div>

        </section>


    </main>


    <!-- ================================================= -->
    <!-- PAGE JS -->
    <!-- ================================================= -->

    <script type="module"
            src="/js/pages/credentials.js">
    </script>


    <!-- ================================================= -->
    <!-- NAVBAR JS -->
    <!-- ================================================= -->

    <script type="module">

        import {
            initNavbar
        } from '/js/components/navbar.js';


        initNavbar();

    </script>


</body>

</html>
