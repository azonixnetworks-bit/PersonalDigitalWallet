<!doctype html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        Folders
    </title>


    <!-- ============================================= -->
    <!-- COMMON STYLES -->
    <!-- ============================================= -->

    <link rel="stylesheet"
          href="/css/main.css">

    <link rel="stylesheet"
          href="/css/layout.css">

    <link rel="stylesheet"
          href="/css/components.css">

    <link rel="stylesheet"
          href="/css/vault.css">

    <link rel="stylesheet"
          href="/css/responsive.css">

</head>


<body>


    <!-- ================================================= -->
    <!-- TOP NAVIGATION -->
    <!-- ================================================= -->

    <header class="topbar">

        <strong>
            Personal Digital Vault
        </strong>


        <nav>

            <a href="/html/dashboard.html">
                Dashboard
            </a>

            <a href="/html/folders.html">
                Folders
            </a>

            <a href="/html/documents.html">
                Documents
            </a>

            <a href="/html/credentials.html">
                Credentials
            </a>

            <a href="/html/search.html">
                Search
            </a>

            <a href="/html/profile.html">
                Profile
            </a>


            <button type="button"
                    data-logout>
                Logout
            </button>

        </nav>

    </header>


    <!-- ================================================= -->
    <!-- MAIN CONTENT -->
    <!-- ================================================= -->

    <main class="container">


        <h1>
            Folders
        </h1>


        <!-- ============================================= -->
        <!-- CREATE FOLDER -->
        <!-- ============================================= -->
        <!--
            Input:
            Folder name.

            Output:
            POST /api/folders
        -->

        <form id="folderForm"
              class="card">

            <label for="folderName">
                Folder Name
            </label>


            <input id="folderName"
                   name="name"
                   type="text"
                   placeholder="Example: Certificates"
                   autocomplete="off"
                   required>


            <button id="createFolderButton"
                    type="submit">

                Create folder

            </button>

        </form>


        <!-- ============================================= -->
        <!-- SUCCESS / ERROR MESSAGE -->
        <!-- ============================================= -->

        <p id="message"
           aria-live="polite">
        </p>


        <!-- ============================================= -->
        <!-- FOLDER LIST -->
        <!-- ============================================= -->

        <section id="list"
                 class="vault-list"
                 aria-live="polite">
        </section>


    </main>


    <!-- ================================================= -->
    <!-- FOLDER PAGE JAVASCRIPT -->
    <!-- ================================================= -->

    <script type="module"
            src="/js/pages/folders.js">
    </script>


    <!-- ================================================= -->
    <!-- NAVBAR / LOGOUT -->
    <!-- ================================================= -->

    <script type="module">

        import {
            initNavbar
        } from '/js/components/navbar.js';


        initNavbar();

    </script>


</body>

</html>
