<div class="toast-region" aria-live="polite" aria-relevant="additions removals">
  @for (item of notification.notifications(); track item.id) {
    <section class="toast" [class]="'toast toast--' + item.tone" role="status">
      <span class="toast__icon" aria-hidden="true">
        @switch (item.tone) {
          @case ('success') { ✓ }
          @case ('warning') { ! }
          @case ('error') { × }
          @default { i }
        }
      </span>
      <p>{{ item.message }}</p>
      <button type="button" class="toast__close" aria-label="Dismiss message" (click)="notification.dismiss(item.id)">×</button>
    </section>
  }
</div>
