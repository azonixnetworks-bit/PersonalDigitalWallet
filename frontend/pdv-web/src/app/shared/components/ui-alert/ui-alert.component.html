<div class="ui-alert" [class]="'ui-alert ui-alert--' + tone()" role="status" aria-live="polite">
  <span class="ui-alert__mark" aria-hidden="true">
    @switch (tone()) {
      @case ('success') { ✓ }
      @case ('warning') { ! }
      @case ('error') { × }
      @default { i }
    }
  </span>
  <span>{{ message() }}</span>
</div>
