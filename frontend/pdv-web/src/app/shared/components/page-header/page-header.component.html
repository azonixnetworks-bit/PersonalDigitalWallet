<header class="page-header">
  <div class="page-header__copy">
    @if (eyebrow()) {
      <span class="eyebrow">{{ eyebrow() }}</span>
    }
    <h1>{{ title() }}</h1>
    @if (subtitle()) {
      <p class="page-subtitle">{{ subtitle() }}</p>
    }
  </div>
  <div class="page-header__actions"><ng-content /></div>
</header>
