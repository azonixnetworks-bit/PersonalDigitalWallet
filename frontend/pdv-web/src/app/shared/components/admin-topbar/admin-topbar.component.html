<header class="admin-topbar">
  <div class="admin-topbar__inner">
    <app-brand [admin]="true" />
    <button class="admin-menu-toggle" type="button" [attr.aria-expanded]="menuOpen()" aria-controls="adminPrimaryNavigation" aria-label="Toggle admin navigation" (click)="toggleMenu()">☰</button>
    <nav id="adminPrimaryNavigation" class="admin-nav" [class.nav-open]="menuOpen()" aria-label="Admin navigation">
      <a class="admin-nav-link" routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Overview</a>
      <a class="admin-nav-link" routerLink="/admin/subscriptions" routerLinkActive="active" (click)="closeMenu()">Billing Metadata</a>
      <button type="button" class="admin-logout" [disabled]="loggingOut()" (click)="logout()">{{ loggingOut() ? 'Signing out…' : 'Logout' }}</button>
    </nav>
  </div>
</header>
