<aside class="vault-sidebar">
  <div class="vault-sidebar__brand-row">
    <app-brand />
    <button class="nav-toggle" type="button" [attr.aria-expanded]="menuOpen()" aria-controls="userPrimaryNavigation" aria-label="Toggle navigation" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
  </div>

  <nav id="userPrimaryNavigation" class="vault-nav" [class.nav-open]="menuOpen()" aria-label="Primary navigation">
    <span class="vault-nav__label">Workspace</span>
    <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">⌂</span><span>Dashboard</span></a>
    <a routerLink="/vault/folders" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">▱</span><span>Folders</span></a>
    <a routerLink="/vault/documents" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">▤</span><span>Documents</span></a>
    <a routerLink="/shared-with-me" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">↗</span><span>Shared With Me</span></a>
    <a routerLink="/vault/credentials" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">✦</span><span>Credentials</span></a>
    <a routerLink="/backup" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">↻</span><span>Backup</span></a>
    <a routerLink="/search" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">⌕</span><span>Search</span></a>
    <span class="vault-nav__label vault-nav__label--account">Account</span>
    <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">◎</span><span>Profile</span></a>
    <a routerLink="/subscription" routerLinkActive="active" (click)="closeMenu()"><span class="nav-icon" aria-hidden="true">$</span><span>Subscription</span></a>
    <button class="logout-button" type="button" [disabled]="loggingOut()" (click)="logout()"><span class="nav-icon" aria-hidden="true">↪</span><span>{{ loggingOut() ? 'Signing out…' : 'Logout' }}</span></button>
  </nav>

  <div class="vault-sidebar__trust">
    <span class="trust-mark" aria-hidden="true">✓</span>
    <div><strong>Zero-access vault</strong><span>Private by design</span></div>
  </div>
</aside>
